<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<body>
<!-- Uso: <div th:replace="~{fragments/encabezado :: encabezado}"></div> -->
<div th:fragment="encabezado">
    <div class="barra-superior">Envíos a toda Colombia · Pago seguro · Marcas originales</div>

    <header class="encabezado">
        <div class="contenedor encabezado-interno">
            <a class="logo" th:href="@{/}">Bodega<span> de Belleza</span></a>

            <form class="buscador" th:action="@{/catalogo}" method="get">
                <input type="search" name="q" placeholder="Busca productos o marcas…" aria-label="Buscar">
                <button type="submit" class="btn btn-primario">Buscar</button>
            </form>

            <nav class="acciones" aria-label="Accesos rápidos">
                <a class="accion" th:href="@{/catalogo}">Catálogo</a>

                <a class="accion" th:href="@{/guardados}" title="Guardados para comprar después">
                    <span class="icono">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-4.4-9.3-9A5.3 5.3 0 0 1 12 6.6 5.3 5.3 0 0 1 21.3 12C19 16.6 12 21 12 21z"/></svg>
                        <span class="contador" th:if="${guardadosCantidad != null and guardadosCantidad gt 0}"
                              th:text="${guardadosCantidad}">0</span>
                    </span>
                    <span>Guardados</span>
                </a>

                <a class="accion" th:href="@{/carrito}" title="Carrito de compras">
                    <span class="icono">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>
                        <span class="contador" th:if="${carritoCantidad != null and carritoCantidad gt 0}"
                              th:text="${carritoCantidad}">0</span>
                    </span>
                    <span>Carrito</span>
                </a>

                <!-- Cuenta: cambia según si hay sesión iniciada y según el rol -->
                <a class="accion" sec:authorize="isAnonymous()" th:href="@{/login}">Ingresar</a>
                <a class="accion accion-destacada" sec:authorize="isAnonymous()" th:href="@{/registro}">Crear cuenta</a>

                <a class="accion" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/productos}">Admin</a>
                <a class="accion" sec:authorize="isAuthenticated()" th:href="@{/mis-pedidos}">Mis pedidos</a>
                <form class="form-salir" sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                    <button type="submit" class="accion btn-salir">Salir</button>
                </form>
            </nav>
        </div>
    </header>

    <!-- Aviso temporal después de agregar, guardar o eliminar -->
    <div class="aviso" role="status" th:if="${mensaje != null}">
        <div class="contenedor" th:text="${mensaje}">Mensaje</div>
    </div>
</div>
</body>
</html>
