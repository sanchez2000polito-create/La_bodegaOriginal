<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<!-- Uso: <div th:replace="~{fragments/tarjeta-producto :: tarjeta(${p})}"></div> -->
<article class="tarjeta" th:fragment="tarjeta(producto)">
    <a class="tarjeta-imagen" th:href="@{/producto/{id}(id=${producto.id})}">
        <img th:unless="${producto.imagenPendiente}"
             th:src="${producto.urlImagen}" th:alt="${producto.nombre}" loading="lazy">
        <div class="imagen-pendiente" th:if="${producto.imagenPendiente}">
            <span>Imagen pendiente</span>
        </div>
        <span class="insignia" th:if="${producto.masVendido}">Más vendido</span>
    </a>

    <div class="tarjeta-cuerpo">
        <p class="tarjeta-marca" th:text="${producto.marca.nombre}">Marca</p>
        <h3 class="tarjeta-nombre">
            <a th:href="@{/producto/{id}(id=${producto.id})}" th:text="${producto.nombre}">Nombre del producto</a>
        </h3>
        <p class="precio" th:text="'$' + ${#numbers.formatDecimal(producto.precio, 0, 'POINT', 0, 'COMMA')}">$0</p>

        <!-- Funciona desde la etapa 4 (carrito). -->
        <form th:action="@{/carrito/agregar}" method="post">
            <input type="hidden" name="productoId" th:value="${producto.id}">
            <button type="submit" class="btn btn-primario btn-bloque" th:disabled="${producto.stock le 0}"
                    th:text="${producto.stock gt 0} ? 'Agregar al carrito' : 'Agotado'">Agregar al carrito</button>
        </form>
    </div>
</article>
</body>
</html>
