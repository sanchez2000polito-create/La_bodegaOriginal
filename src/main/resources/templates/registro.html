<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Crear cuenta')}"></head>
<body>
<div th:replace="~{fragments/encabezado :: encabezado}"></div>

<main class="contenedor seccion">
    <div class="auth-caja">
        <h1 class="titulo-pagina">Crear cuenta</h1>

        <form class="formulario" th:action="@{/registro}" th:object="${registroForm}" method="post" novalidate>
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" autocomplete="name">
            <small class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</small>

            <label for="email">Correo electrónico</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email">
            <small class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</small>

            <label for="password">Contraseña (mínimo 8 caracteres)</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="new-password">
            <small class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</small>

            <label for="confirmar">Repite la contraseña</label>
            <input id="confirmar" type="password" th:field="*{confirmar}" autocomplete="new-password">
            <small class="error" th:if="${#fields.hasErrors('confirmar')}" th:errors="*{confirmar}">Error</small>

            <button type="submit" class="btn btn-primario btn-bloque">Crear cuenta</button>
        </form>

        <p class="texto-suave auth-pie">¿Ya tienes cuenta?
            <a class="enlace-inline" th:href="@{/login}">Ingresar</a></p>
    </div>
</main>

<footer th:replace="~{fragments/pie :: pie}"></footer>
</body>
</html>
