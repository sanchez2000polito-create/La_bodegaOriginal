<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Ingresar')}"></head>
<body>
<div th:replace="~{fragments/encabezado :: encabezado}"></div>

<main class="contenedor seccion">
    <div class="auth-caja">
        <h1 class="titulo-pagina">Ingresar</h1>

        <p class="aviso-form aviso-error" th:if="${param.error}">Correo o contraseña incorrectos.</p>
        <p class="aviso-form aviso-ok" th:if="${param.registrado}">Cuenta creada. Ya puedes ingresar.</p>
        <p class="aviso-form aviso-ok" th:if="${param.salio}">Cerraste sesión.</p>

        <form class="formulario" th:action="@{/login}" method="post">
            <label for="username">Correo electrónico</label>
            <input id="username" type="email" name="username" autocomplete="username" required autofocus>

            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>

            <button type="submit" class="btn btn-primario btn-bloque">Ingresar</button>
        </form>

        <p class="texto-suave auth-pie">¿Aún no tienes cuenta?
            <a class="enlace-inline" th:href="@{/registro}">Crear cuenta</a></p>
    </div>
</main>

<footer th:replace="~{fragments/pie :: pie}"></footer>
</body>
</html>
