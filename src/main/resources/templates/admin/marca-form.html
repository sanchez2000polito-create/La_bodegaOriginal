<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Admin: marca')}"></head>
<body>
<div th:replace="~{fragments/encabezado :: encabezado}"></div>

<main class="contenedor seccion">
    <div class="admin-cabecera">
        <h1 class="titulo-pagina" th:text="${marcaForm.id == null} ? 'Nueva marca' : 'Editar marca'">Marca</h1>
    </div>

    <nav th:replace="~{fragments/admin-menu :: menu('marcas')}"></nav>

    <form class="formulario formulario-admin formulario-angosto" th:action="@{${accion}}" th:object="${marcaForm}"
          method="post" novalidate>
        <label for="nombre">Nombre de la marca</label>
        <input id="nombre" type="text" th:field="*{nombre}" autofocus>
        <small class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</small>

        <div class="formulario-botones">
            <button type="submit" class="btn btn-primario">Guardar marca</button>
            <a class="btn btn-secundario" th:href="@{/admin/marcas}">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/pie :: pie}"></footer>
</body>
</html>
