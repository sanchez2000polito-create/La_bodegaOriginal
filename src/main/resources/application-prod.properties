# PostgreSQL: los valores se toman de variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bodega}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Administrador inicial: se toma de variables de entorno (si están vacías, no se crea)
tienda.admin.nombre=Administrador
tienda.admin.email=${ADMIN_EMAIL:}
tienda.admin.password=${ADMIN_PASSWORD:}

# Envío: costo y valor desde el cual es gratis (COP)
tienda.envio.costo=12900
tienda.envio.gratis-desde=150000
